[project]
name = "pdf-extractext-extractor"
version = "0.1.0"
description = "Microservicio que extrae el texto de un PDF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pypdf>=4.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
